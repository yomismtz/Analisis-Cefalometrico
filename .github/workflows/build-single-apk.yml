name: Build YomCeph Cefalometrico APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated YomCeph source
        uses: actions/checkout@v4
        with:
          repository: yomismtz/-ngulos-cefalometricos
          ref: redesign/flujo-puntos-y-guias

      - name: Apply current clinical and partial-result fixes
        run: python3 ci/prepare-test-build.py

      - name: Normalize precision pad dimensions
        run: |
          sed -i 's/dp(1\.6f)/dp(2)/g; s/dp(5f)/dp(5)/g' app/src/main/java/com/cefalo/angulos/AnalysisActivity.java

      - name: Convert to single cephalometric module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace("applicationId 'com.yomceph.app'", "applicationId 'com.yomceph.cefalometrico'")
          gradle.write_text(g, encoding='utf-8')

          for path in [Path('app/src/main/res/values/strings.xml'), Path('app/src/main/res/values-en/strings.xml')]:
              s = path.read_text(encoding='utf-8')
              if 'values-en' in str(path):
                  s = s.replace('<string name="app_name">YomCeph</string>', '<string name="app_name">YomCeph Cephalometric</string>')
                  s = s.replace('<string name="app_slogan">Trace. Measure. Learn.</string>', '<string name="app_slogan">Cephalometric analysis</string>')
                  s = s.replace('<string name="analysis_steiner">', '<string name="analysis_steiner">CEPHALOMETRIC ANALYSIS<!--')
                  s = s.replace('</string>', '--></string>', 1) if '<!--' in s.split('\n')[4] else s
              else:
                  s = s.replace('<string name="app_name">YomCeph</string>', '<string name="app_name">YomCeph Cefalométrico</string>')
                  s = s.replace('<string name="app_slogan">Traza. Mide. Aprende.</string>', '<string name="app_slogan">Análisis cefalométrico</string>')
                  import re
                  s = re.sub(r'<string name="analysis_steiner">.*?</string>', '<string name="analysis_steiner">ANÁLISIS CEFALOMÉTRICO</string>', s)
              path.write_text(s, encoding='utf-8')

          en = Path('app/src/main/res/values-en/strings.xml')
          s = en.read_text(encoding='utf-8')
          import re
          s = re.sub(r'<string name="analysis_steiner">.*?</string>', '<string name="analysis_steiner">CEPHALOMETRIC ANALYSIS</string>', s)
          s = s.replace('<!--', '').replace('-->', '')
          en.write_text(s, encoding='utf-8')

          main = Path('app/src/main/java/com/cefalo/angulos/MainActivity.java')
          m = main.read_text(encoding='utf-8')
          anchor = '        TextView btnTheme = findViewById(R.id.btnTheme);\n'
          hide = '''        TextView btnTheme = findViewById(R.id.btnTheme);\n\n        // Edición de módulo único: conserva utilidades, estudios y privacidad,\n        // pero no expone los otros módulos clínicos.\n        btnVertebral.setVisibility(android.view.View.GONE);\n        btnPowell.setVisibility(android.view.View.GONE);\n        btnTweed.setVisibility(android.view.View.GONE);\n        btnLevandoski.setVisibility(android.view.View.GONE);\n        btnAirway.setVisibility(android.view.View.GONE);\n'''
          if anchor in m:
              m = m.replace(anchor, hide, 1)
          main.write_text(m, encoding='utf-8')
          PY

      - name: Apply standalone cephalometric branding
        shell: bash
        run: |
          cat > app/src/main/res/drawable/ic_yomceph_foreground.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M27,28 C20,31 20,40 22,49 C24,58 27,70 31,75 C34,78 36,75 37,70 L39,62 C40,58 43,58 44,62 L46,70 C47,75 50,76 52,72 C56,65 58,54 59,46 C60,37 58,30 52,27 C48,25 44,28 41,30 C37,27 32,25 27,28 Z" />
              <path android:fillColor="#22BFC7" android:pathData="M30,43 A2.5,2.5 0,1 0,35,43 A2.5,2.5 0,1 0,30,43 M45,43 A2.5,2.5 0,1 0,50,43 A2.5,2.5 0,1 0,45,43" />
              <path android:fillColor="@android:color/transparent" android:strokeColor="#B9F3E6" android:strokeWidth="2" android:strokeLineCap="round" android:pathData="M34,52 C37,55 42,55 46,52" />

              <path android:fillColor="@android:color/transparent" android:strokeColor="#FFFFFF" android:strokeWidth="3" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M69,26 C78,24 86,30 88,38 C89,43 87,47 85,50 L91,53 L85,57 L85,62 L80,64 L80,70 L71,73 C65,71 61,66 60,59 C59,51 60,43 63,35 C64,31 66,28 69,26" />
              <path android:fillColor="#B9F3E6" android:pathData="M72,40 A3,3 0,1 0,78,40 A3,3 0,1 0,72,40" />
              <path android:fillColor="@android:color/transparent" android:strokeColor="#22BFC7" android:strokeWidth="2" android:strokeLineCap="round" android:pathData="M84,51 L78,52 L74,57" />

              <path android:fillColor="@android:color/transparent" android:strokeColor="#22BFC7" android:strokeWidth="4" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M48,78 L82,78 L82,47 Z" />
              <path android:fillColor="@android:color/transparent" android:strokeColor="#B9F3E6" android:strokeWidth="2" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M62,72 L76,72 L76,59 Z" />
              <path android:strokeColor="#FFFFFF" android:strokeWidth="1.4" android:strokeLineCap="round" android:fillColor="@android:color/transparent" android:pathData="M55,77 L55,73 M62,77 L62,74 M69,77 L69,73 M76,77 L76,74" />
          </vector>
          XML

          cat > app/src/main/res/drawable/ic_yomceph_mark.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#6842B8" android:pathData="M20,8 L88,8 C95,8 100,13 100,20 L100,88 C100,95 95,100 88,100 L20,100 C13,100 8,95 8,88 L8,20 C8,13 13,8 20,8 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M27,28 C20,31 20,40 22,49 C24,58 27,70 31,75 C34,78 36,75 37,70 L39,62 C40,58 43,58 44,62 L46,70 C47,75 50,76 52,72 C56,65 58,54 59,46 C60,37 58,30 52,27 C48,25 44,28 41,30 C37,27 32,25 27,28 Z" />
              <path android:fillColor="#22BFC7" android:pathData="M30,43 A2.5,2.5 0,1 0,35,43 A2.5,2.5 0,1 0,30,43 M45,43 A2.5,2.5 0,1 0,50,43 A2.5,2.5 0,1 0,45,43" />
              <path android:fillColor="@android:color/transparent" android:strokeColor="#B9F3E6" android:strokeWidth="2" android:strokeLineCap="round" android:pathData="M34,52 C37,55 42,55 46,52" />
              <path android:fillColor="@android:color/transparent" android:strokeColor="#FFFFFF" android:strokeWidth="3" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M69,26 C78,24 86,30 88,38 C89,43 87,47 85,50 L91,53 L85,57 L85,62 L80,64 L80,70 L71,73 C65,71 61,66 60,59 C59,51 60,43 63,35 C64,31 66,28 69,26" />
              <path android:fillColor="#B9F3E6" android:pathData="M72,40 A3,3 0,1 0,78,40 A3,3 0,1 0,72,40" />
              <path android:fillColor="@android:color/transparent" android:strokeColor="#22BFC7" android:strokeWidth="2" android:strokeLineCap="round" android:pathData="M84,51 L78,52 L74,57" />
              <path android:fillColor="@android:color/transparent" android:strokeColor="#22BFC7" android:strokeWidth="4" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M48,78 L82,78 L82,47 Z" />
              <path android:fillColor="@android:color/transparent" android:strokeColor="#B9F3E6" android:strokeWidth="2" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M62,72 L76,72 L76,59 Z" />
              <path android:strokeColor="#FFFFFF" android:strokeWidth="1.4" android:strokeLineCap="round" android:fillColor="@android:color/transparent" android:pathData="M55,77 L55,73 M62,77 L62,74 M69,77 L69,73 M76,77 L76,74" />
          </vector>
          XML

          cp app/src/main/res/drawable/ic_yomceph_mark.xml app/src/main/res/mipmap-anydpi/ic_launcher.xml

          cat > app/src/main/res/drawable/ic_yomceph_monochrome.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#000000" android:pathData="M27,28 C20,31 20,40 22,49 C24,58 27,70 31,75 C34,78 36,75 37,70 L39,62 C40,58 43,58 44,62 L46,70 C47,75 50,76 52,72 C56,65 58,54 59,46 C60,37 58,30 52,27 C48,25 44,28 41,30 C37,27 32,25 27,28 Z" />
              <path android:fillColor="@android:color/transparent" android:strokeColor="#000000" android:strokeWidth="3" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M69,26 C78,24 86,30 88,38 C89,43 87,47 85,50 L91,53 L85,57 L85,62 L80,64 L80,70 L71,73 C65,71 61,66 60,59 C59,51 60,43 63,35 C64,31 66,28 69,26 M48,78 L82,78 L82,47 Z" />
          </vector>
          XML

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Test and build debug APK
        run: |
          gradle --no-daemon :app:testDebugUnitTest
          gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk YomCeph-Cefalometrico-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YomCeph-Cefalometrico-Test-APK
          path: YomCeph-Cefalometrico-test.apk
          if-no-files-found: error
