name: Build Yom lateral skull analysis APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'sync/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited Yom radiographic source
        uses: actions/checkout@v4
        with:
          repository: yomismtz/-ngulos-cefalometricos
          ref: redesign/radiografia-integral

      - name: Apply mobile tracing workflow
        run: python3 ci/prepare-test-build.py

      - name: Apply clinical extensions and visual guides
        run: python3 ci/extend-clinical-build.py

      - name: Expand McGregor guide
        run: python3 ci/augment-mcgregor-guide.py

      - name: Keep only calculable partial results
        run: python3 ci/fix-result-diagnostics.py

      - name: Apply final radiographic audit
        run: python3 ci/final-radiographic-audit.py

      - name: Refine radiographic helper logic
        run: python3 ci/refine-radiographic-logic.py

      - name: Apply Yom branding and calibration assistant
        run: python3 ci/mobile-brand-calibration.py

      - name: Apply exact fine adjustment
        run: python3 ci/mobile-fine-adjust.py

      - name: Refine original landmark guides
        run: python3 ci/mobile-guide-polish.py

      - name: Generate dedicated tablet layout
        run: python3 ci/mobile-responsive-layouts.py

      - name: Convert to Steiner-only lateral skull edition
        run: python3 ci/prepare-steiner-only.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run Android lint
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:lintDebug
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            test -f app/build/reports/lint-results-debug.txt && grep -n -A4 -B2 "Error:" app/build/reports/lint-results-debug.txt || true
            exit $STATUS
          fi

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Enable KVM for launch test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify APK really opens on Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.yomceph.cefalometrico
            adb shell am start -W -n com.yomceph.cefalometrico/com.cefalo.angulos.MainActivity
            sleep 4
            PID=$(adb shell pidof com.yomceph.cefalometrico | tr -d '\r')
            if [ -z "$PID" ]; then
              echo "Launcher process exited after opening. Recent AndroidRuntime log:"
              adb logcat -d -t 500 | grep -E "FATAL EXCEPTION|AndroidRuntime|com.yomceph.cefalometrico" || true
              exit 1
            fi
            echo "Launcher smoke test passed with PID $PID"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Yom-analisis-de-lateral-de-craneo-v1.25-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yom-analisis-de-lateral-de-craneo-v1.25-Test-APK
          path: Yom-analisis-de-lateral-de-craneo-v1.25-test.apk
          if-no-files-found: error
