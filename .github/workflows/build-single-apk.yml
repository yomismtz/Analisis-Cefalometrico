name: Build Yom lateral skull analysis APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout standalone configuration
        uses: actions/checkout@v4
        with:
          path: standalone

      - name: Checkout current validated radiographic source
        uses: actions/checkout@v4
        with:
          repository: yomismtz/-ngulos-cefalometricos
          ref: redesign/radiografia-integral
          path: source

      - name: Prepare current tracing build
        working-directory: source
        run: python3 ci/prepare-test-build.py

      - name: Normalize tangent help
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/cefalo/angulos/PointGuide.java')
          s = path.read_text(encoding='utf-8')
          s = s.replace(
              'GUIDE.put("Go", "Gonion (Go): punto construido sobre el ángulo mandibular, en la bisectriz formada por la tangente al borde posterior de la rama y la tangente al borde inferior del cuerpo mandibular.");',
              'GUIDE.put("Go", "Gonion (Go): punto construido sobre el ángulo mandibular. Para construirlo geométricamente trace 2 tangentes: una al borde posterior de la rama y otra al borde inferior del cuerpo mandibular. Cada tangente se define con 2 puntos de apoyo/contacto sobre su contorno; después se obtiene la bisectriz del ángulo formado por ambas tangentes y se localiza Go según el protocolo cefalométrico.");'
          )
          path.write_text(s, encoding='utf-8')
          PY

      - name: Apply clinical extensions and visual guides
        working-directory: source
        run: python3 ci/extend-clinical-build.py

      - name: Expand McGregor cranio-cervical guide
        working-directory: source
        run: python3 ci/augment-mcgregor-guide.py

      - name: Keep only calculable partial results
        working-directory: source
        run: python3 ci/fix-result-diagnostics.py

      - name: Apply final radiographic audit
        working-directory: source
        run: python3 ci/final-radiographic-audit.py

      - name: Refine radiographic assessment logic
        working-directory: source
        run: python3 ci/refine-radiographic-logic.py

      - name: Apply branding and calibration assistant
        working-directory: source
        run: python3 ci/mobile-brand-calibration.py

      - name: Apply exact fine adjustment
        working-directory: source
        run: python3 ci/mobile-fine-adjust.py

      - name: Refine per-landmark visual guides
        working-directory: source
        run: python3 ci/mobile-guide-polish.py

      - name: Generate responsive phone/tablet build and current complementary angles
        working-directory: source
        run: python3 ci/mobile-responsive-layouts.py

      - name: Convert to dedicated comprehensive lateral-skull app
        working-directory: source
        run: python3 ../standalone/ci/standalone-lateral.py

      - name: Apply distinct lateral-skull launcher icon
        working-directory: source
        shell: bash
        run: |
          cat > app/src/main/res/drawable/ic_yomceph_foreground.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="@android:color/transparent" android:strokeColor="#FFFFFF" android:strokeWidth="3.4" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M43,20 C56,17 69,23 74,34 C77,40 76,46 73,51 L80,54 L74,59 L74,65 L68,67 L68,75 L57,79 C48,77 42,70 40,61 C38,51 39,40 41,31 C42,26 42,23 43,20" />
              <path android:fillColor="#B9F3E6" android:pathData="M52,38 A3,3 0,1 0,58,38 A3,3 0,1 0,52,38" />
              <path android:fillColor="@android:color/transparent" android:strokeColor="#22BFC7" android:strokeWidth="2.5" android:strokeLineCap="round" android:pathData="M70,53 L61,54 L56,61" />
              <path android:fillColor="@android:color/transparent" android:strokeColor="#22BFC7" android:strokeWidth="3.8" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M24,83 L82,83 L82,39 Z" />
              <path android:fillColor="@android:color/transparent" android:strokeColor="#B9F3E6" android:strokeWidth="2" android:strokeLineCap="round" android:pathData="M34,75 L70,75 M44,67 L70,67 M54,59 L70,59" />
              <path android:fillColor="#FFFFFF" android:pathData="M40,28 A2.4,2.4 0,1 0,44.8,28 A2.4,2.4 0,1 0,40,28 M51,38 A2.4,2.4 0,1 0,55.8,38 A2.4,2.4 0,1 0,51,38 M59,54 A2.4,2.4 0,1 0,63.8,54 A2.4,2.4 0,1 0,59,54 M56,69 A2.4,2.4 0,1 0,60.8,69 A2.4,2.4 0,1 0,56,69" />
          </vector>
          XML

          cat > app/src/main/res/drawable/ic_yomceph_mark.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#6842B8" android:pathData="M20,8 L88,8 C95,8 100,13 100,20 L100,88 C100,95 95,100 88,100 L20,100 C13,100 8,95 8,88 L8,20 C8,13 13,8 20,8 Z" />
              <path android:fillColor="@android:color/transparent" android:strokeColor="#FFFFFF" android:strokeWidth="3.4" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M43,20 C56,17 69,23 74,34 C77,40 76,46 73,51 L80,54 L74,59 L74,65 L68,67 L68,75 L57,79 C48,77 42,70 40,61 C38,51 39,40 41,31 C42,26 42,23 43,20" />
              <path android:fillColor="#B9F3E6" android:pathData="M52,38 A3,3 0,1 0,58,38 A3,3 0,1 0,52,38" />
              <path android:fillColor="@android:color/transparent" android:strokeColor="#22BFC7" android:strokeWidth="2.5" android:strokeLineCap="round" android:pathData="M70,53 L61,54 L56,61" />
              <path android:fillColor="@android:color/transparent" android:strokeColor="#22BFC7" android:strokeWidth="3.8" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M24,83 L82,83 L82,39 Z" />
              <path android:fillColor="@android:color/transparent" android:strokeColor="#B9F3E6" android:strokeWidth="2" android:strokeLineCap="round" android:pathData="M34,75 L70,75 M44,67 L70,67 M54,59 L70,59" />
          </vector>
          XML

          cp app/src/main/res/drawable/ic_yomceph_mark.xml app/src/main/res/mipmap-anydpi/ic_launcher.xml

      - name: Read app version
        id: app_version
        working-directory: source
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n 1)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        working-directory: source
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run Android lint
        working-directory: source
        run: gradle --no-daemon :app:lintDebug :app:lintRelease

      - name: Build test APK
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug

      - name: Enable KVM for launch test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify APK really opens on Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r source/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.yomceph.cefalometrico
            adb shell am start -W -n com.yomceph.cefalometrico/com.cefalo.angulos.MainActivity
            sleep 4
            test -n "$(adb shell pidof com.yomceph.cefalometrico | tr -d '\r')"
            echo "Standalone lateral launcher remained alive after cold start"

      - name: Rename APK
        shell: bash
        run: cp source/app/build/outputs/apk/debug/app-debug.apk "Yom-analisis-lateral-craneo-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yom-Analisis-Lateral-Craneo-APK-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}
          path: Yom-analisis-lateral-craneo-v${{ steps.app_version.outputs.name }}-${{ steps.app_version.outputs.code }}.apk
          if-no-files-found: error
