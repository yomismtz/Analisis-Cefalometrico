name: Build Yom Análisis Radiográficos Steiner APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'sync/**' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited Yom radiographic source
        uses: actions/checkout@v4
        with:
          repository: yomismtz/-ngulos-cefalometricos
          ref: redesign/radiografia-integral

      - name: Apply mobile tracing workflow
        run: python3 ci/prepare-test-build.py

      - name: Apply clinical extensions and visual guides
        run: python3 ci/extend-clinical-build.py

      - name: Expand McGregor guide
        run: python3 ci/augment-mcgregor-guide.py

      - name: Apply partial-result report behavior
        run: python3 ci/fix-result-diagnostics.py

      - name: Apply final verified radiographic audit
        run: python3 ci/final-radiographic-audit.py

      - name: Refine radiographic helper logic
        run: python3 ci/refine-radiographic-logic.py

      - name: Apply Yom branding and calibration assistant
        run: python3 ci/mobile-brand-calibration.py

      - name: Apply exact fine adjustment
        run: python3 ci/mobile-fine-adjust.py

      - name: Refine original landmark guides
        run: python3 ci/mobile-guide-polish.py

      - name: Generate dedicated tablet layout
        run: python3 ci/mobile-responsive-layouts.py

      - name: Convert to standalone Steiner module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace("applicationId 'com.yomceph.app'", "applicationId 'com.yomceph.cefalometrico'")
          gradle.write_text(g, encoding='utf-8')

          # Keep the same Yom Análisis Radiográficos brand in both APKs.
          # The Steiner-only edition is differentiated by its only visible module.
          for rel in ['app/src/main/res/values/strings.xml', 'app/src/main/res/values-en/strings.xml']:
              path = Path(rel)
              if not path.exists():
                  continue
              s = path.read_text(encoding='utf-8')
              s = re.sub(r'<string name="app_name">.*?</string>',
                         '<string name="app_name">Yom Análisis Radiográficos</string>', s)
              if 'values-en' in rel:
                  s = re.sub(r'<string name="app_slogan">.*?</string>',
                             '<string name="app_slogan">Cephalometrics and radiographic analysis</string>', s)
                  s = re.sub(r'<string name="analysis_steiner">.*?</string>',
                             '<string name="analysis_steiner">CEPHALOMETRIC ANALYSIS · STEINER</string>', s)
              else:
                  s = re.sub(r'<string name="app_slogan">.*?</string>',
                             '<string name="app_slogan">Cefalometría y análisis radiográfico</string>', s)
                  s = re.sub(r'<string name="analysis_steiner">.*?</string>',
                             '<string name="analysis_steiner">ANÁLISIS CEFALOMÉTRICO · STEINER</string>', s)
              path.write_text(s, encoding='utf-8')

          main = Path('app/src/main/java/com/cefalo/angulos/MainActivity.java')
          m = main.read_text(encoding='utf-8')
          anchor = '        updateThemeButton(btnTheme);\n'
          hide = '''        // Steiner-only edition: same tracing engine and responsive UI,
        // but only the cephalometric lateral-skull module remains visible.
        btnVertebral.setVisibility(android.view.View.GONE);
        btnPowell.setVisibility(android.view.View.GONE);
        btnTweed.setVisibility(android.view.View.GONE);
        btnLevandoski.setVisibility(android.view.View.GONE);
        btnAirway.setVisibility(android.view.View.GONE);
        btnCvm.setVisibility(android.view.View.GONE);
        btnNolla.setVisibility(android.view.View.GONE);
        btnResorption.setVisibility(android.view.View.GONE);
        btnPanoramicReview.setVisibility(android.view.View.GONE);
        android.view.View panoSection = findViewById(R.id.sectionPanoramic);
        if (panoSection != null) panoSection.setVisibility(android.view.View.GONE);

        updateThemeButton(btnTheme);
'''
          if anchor not in m:
              raise SystemExit('Could not locate standalone visibility anchor')
          m = m.replace(anchor, hide, 1)
          main.write_text(m, encoding='utf-8')
          PY

      - name: Apply standalone icon
        shell: bash
        run: |
          cat > app/src/main/res/drawable/ic_yomceph_foreground.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M27,28 C20,31 20,40 22,49 C24,58 27,70 31,75 C34,78 36,75 37,70 L39,62 C40,58 43,58 44,62 L46,70 C47,75 50,76 52,72 C56,65 58,54 59,46 C60,37 58,30 52,27 C48,25 44,28 41,30 C37,27 32,25 27,28 Z" />
              <path android:fillColor="#22BFC7" android:pathData="M30,43 A2.5,2.5 0,1 0,35,43 A2.5,2.5 0,1 0,30,43 M45,43 A2.5,2.5 0,1 0,50,43 A2.5,2.5 0,1 0,45,43" />
              <path android:fillColor="@android:color/transparent" android:strokeColor="#FFFFFF" android:strokeWidth="3" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M69,26 C78,24 86,30 88,38 C89,43 87,47 85,50 L91,53 L85,57 L85,62 L80,64 L80,70 L71,73 C65,71 61,66 60,59 C59,51 60,43 63,35 C64,31 66,28 69,26 M48,78 L82,78 L82,47 Z" />
              <path android:fillColor="@android:color/transparent" android:strokeColor="#22BFC7" android:strokeWidth="4" android:strokeLineCap="round" android:pathData="M48,78 L82,78 L82,47" />
          </vector>
          XML

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run Android lint
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:lintDebug
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            test -f app/build/reports/lint-results-debug.txt && grep -n -A4 -B2 "Error:" app/build/reports/lint-results-debug.txt || true
            exit $STATUS
          fi

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Yom-Analisis-Radiograficos-Steiner-v1.24-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yom-Analisis-Radiograficos-Steiner-v1.24-Test-APK
          path: Yom-Analisis-Radiograficos-Steiner-v1.24-test.apk
          if-no-files-found: error
